openapi: 3.1.0
info:
  title: Legal Service
  description: "Legal Service provides APIs to help with legal data governance in\
    \ the Data Lake. JSON request bodies must match schema types: numbers, booleans,\
    \ objects and arrays are not coerced to strings (for example `\"contractId\":\
    \ 12345` returns 400; use `\"12345\"`), and strings or floats are not coerced\
    \ to integers (for example `\"limit\": 2.5` returns 400). See [Legal Service Documentation](https://osdu.pages.opengroup.org/platform/security-and-compliance/legal)."
  contact:
    name: OSDU Data Platform Team
    email: dps@OSDU.org
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: /api/legal/v1/
security:
- Authorization: []
tags:
- name: health
  description: Health related endpoints
- name: legaltag
  description: LegalTags related endpoints
- name: legaltag-status-job
  description: LegalTags status Job related endpoints
- name: info
  description: Version info endpoint
paths:
  /legaltags:
    get:
      tags:
      - legaltag
      summary: Gets all LegalTags.
      description: This allows for the retrieval of all LegalTags.
      operationId: listLegalTags
      parameters:
      - name: valid
        in: query
        description: "If true returns only valid LegalTags, if false returns only\
          \ invalid LegalTags.  Default value is true."
        required: false
        schema:
          type: boolean
          default: true
      - name: data-partition-id
        in: header
        description: Tenant Id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Retrieved LegalTags successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalTagDtos"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: User not authorized to perform the action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          description: Requested LegalTag to update was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
      - Authorization: []
    put:
      tags:
      - legaltag
      summary: Updates the LegalTag for the given `name`.
      description: This allows to update certain properties of your LegalTag using
        the `name` associated with it.
      operationId: updateLegalTag
      parameters:
      - name: data-partition-id
        in: header
        description: Tenant Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLegalTag"
        required: true
      responses:
        "200":
          description: Updated LegalTag successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalTagDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: User not authorized to perform the action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          description: Requested LegalTag to update was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "409":
          description: A LegalTag with the given name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
      - Authorization: []
    post:
      tags:
      - legaltag
      summary: Creates the LegalTag for the given `name`.
      description: This allows for the creation of your LegalTag. There can only be
        1 LegalTag per `name`. A LegalTag must be created before you can start ingesting
        data for that name.
      operationId: createLegalTag
      parameters:
      - name: data-partition-id
        in: header
        description: Tenant Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLegalTag"
        required: true
      responses:
        "201":
          description: Created LegalTag successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalTagDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: User not authorized to perform the action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "409":
          description: A LegalTag with the given name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
      - Authorization: []
  /legaltags:validate:
    post:
      tags:
      - legaltag
      summary: Retrieves the invalid LegalTag names with reasons for the given `names`.
      description: This allows for the retrieval of the reason why your LegalTag is
        not valid. A maximum of 25 can be retrieved at once.
      operationId: validateLegalTags
      parameters:
      - name: data-partition-id
        in: header
        description: Tenant Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestLegalTags"
        required: true
      responses:
        "200":
          description: Retrieved LegalTag names with reason successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidTagsWithReason"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: User not authorized to perform the action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          description: LegalTag names were not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
      - Authorization: []
  /legaltags:query:
    post:
      tags:
      - legaltag
      summary: Retrieves the legaltags which matches query criteria or none if there
        is no match.
      description: "This allows query for specific attributes of legaltags including\
        \ the attributes of extensionproperties. See [https://osdu.pages.opengroup.org/platform/security-and-compliance/legal/api/#legal-query](https://osdu.pages.opengroup.org/platform/security-and-compliance/legal/api/#legal-query)\
        \ for more details."
      operationId: queryLegalTag
      parameters:
      - name: valid
        in: query
        description: "If true returns only valid LegalTags, if false returns only\
          \ invalid LegalTags.  Default value is true."
        required: false
        schema:
          type: boolean
          default: true
      - name: data-partition-id
        in: header
        description: Tenant Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryLegalTag"
        required: true
      responses:
        "200":
          description: Retrieved LegalTags successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalTagDtos"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: User not authorized to perform the action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          description: Requested LegalTag to update was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "405":
          description: Method not allowed. Legal Query API is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
      - Authorization: []
  /legaltags:batchRetrieve:
    post:
      tags:
      - legaltag
      summary: Retrieves the LegalTags for the given `names`.
      description: This allows for the retrieval of your LegalTags using the `name`
        associated with it. A maximum of 25 can be retrieved at once.
      operationId: getLegalTags
      parameters:
      - name: data-partition-id
        in: header
        description: Tenant Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestLegalTags"
        required: true
      responses:
        "200":
          description: Retrieved LegalTags successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalTagDtos"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: User not authorized to perform the action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          description: One or more requested LegalTags were not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
      - Authorization: []
  /legaltags:properties:
    get:
      tags:
      - legaltag
      summary: Gets LegalTag property values.
      description: This allows for the retrieval of allowed values for LegalTag properties.
      operationId: getLegalTagProperties
      parameters:
      - name: data-partition-id
        in: header
        description: Tenant Id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Retrieved LegalTag properties successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadablePropertyValues"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: User not authorized to perform the action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
      - Authorization: []
  /legaltags/{name}:
    get:
      tags:
      - legaltag
      summary: Gets a LegalTag for the given `name`.
      description: "This allows for the retrieval of your LegalTag using the `name`\
        \ associated with it. A missing tag returns HTTP 404 with the standard AppError\
        \ body (`code`, `reason`, `message`), not `{\"error\":\"Not found.\"}`."
      operationId: getLegalTag
      parameters:
      - name: name
        in: path
        description: Name of the LegalTag
        required: true
        schema:
          type: string
          maxLength: 100
          minLength: 3
          pattern: "^[-A-Za-z0-9]{3,100}$"
        example: OSDU-Private-USA-EHC
      - name: data-partition-id
        in: header
        description: Tenant Id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Retrieved LegalTag successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalTagDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: User not authorized to perform the action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          description: Requested LegalTag was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
      - Authorization: []
    delete:
      tags:
      - legaltag
      summary: Deletes a LegalTag for the given `name`.
      description: This allows for the deletion of your LegalTag with the given `name`.
        This makes the given legaltags data invalid.
      operationId: deleteLegalTag
      parameters:
      - name: name
        in: path
        description: Name of the LegalTag to delete
        required: true
        schema:
          type: string
          maxLength: 100
          minLength: 3
          pattern: "^[-A-Za-z0-9]{3,100}$"
        example: OSDU-Private-USA-EHC
      - name: data-partition-id
        in: header
        description: Tenant Id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: LegalTag deleted successfully.
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: User not authorized to perform the action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          description: Requested LegalTag to delete was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
      - Authorization: []
  /jobs/updateLegalTagStatus:
    get:
      tags:
      - legaltag-status-job
      summary: Check LegalTag Compliance Job Status
      description: To check LegalTag Compliance Job Status.
      operationId: checkLegalTagStatusChanges
      parameters:
      - name: data-partition-id
        in: header
        description: Tenant Id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: LegalTag status job completed successfully.
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: User not authorized to perform the action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
      - Authorization: []
  /info:
    get:
      tags:
      - info
      summary: Version info
      description: "For deployment available public `/info` endpoint, which provides\
        \ build and git related information."
      operationId: info
      responses:
        "200":
          description: Version info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
      security: []
  /_ah/readiness_check:
    get:
      tags:
      - health
      summary: Readiness Check endpoint
      description: Public readiness probe. Returns HTTP 200 with an empty body. Does
        not return a text message.
      operationId: readinessCheck
      responses:
        "200":
          description: OK
      security: []
  /_ah/liveness_check:
    get:
      tags:
      - health
      summary: Liveness Check endpoint
      description: Public liveness probe. Returns HTTP 200 with an empty body. Does
        not return a text message.
      operationId: livenessCheck
      responses:
        "200":
          description: OK
      security: []
components:
  schemas:
    UpdateLegalTag:
      type: object
      additionalProperties: false
      description: The model to update an existing LegalTag
      properties:
        name:
          type: string
          description: The name of the LegalTag
          example: OSDU-Private-EHCData
          maxLength: 100
          minLength: 3
          pattern: "^[-A-Za-z0-9]{3,100}$"
        contractId:
          type: string
          description: "The Id of the physical contract associated with the data being\
            \ ingested. Allows 'Unknown', 'No Contract Related', or a real contract\
            \ id. Optional: omit to keep the existing value."
          example: A1234
          maxLength: 40
          minLength: 3
          pattern: "^(Unknown|No Contract Related|[-.A-Za-z0-9]{3,40})$"
        description:
          type: string
          description: Optional description for discoverability. Omit to keep the
            existing value.
        expirationDate:
          type:
          - string
          - "null"
          format: date
          description: Optional expiration date in the format YYYY-MM-DD. Must be
            a future date when provided. Omit or send null to keep the existing
            value. A stored date cannot be cleared.
          example: 2099-12-25
        extensionProperties:
          type: object
          additionalProperties: true
          description: The optional object field to attach any company specific attributes.
            Omit to keep the existing value.
      required:
      - name
    LegalTagDto:
      type: object
      additionalProperties: false
      description: Represents a single LegalTag
      properties:
        name:
          type: string
          description: The name of the LegalTag
          example: OSDU-Private-EHCData
          maxLength: 100
          minLength: 3
          pattern: "^[-A-Za-z0-9]{3,100}$"
        description:
          type: string
          description: The description of the LegalTag
        properties:
          $ref: "#/components/schemas/Properties"
          description: LegalTag properties
      required:
      - name
      - properties
    Properties:
      type: object
      properties:
        countryOfOrigin:
          type: array
          description: List of ISO 3166-1 alpha-2 country codes where the data originated.
          items:
            type: string
            example: US
          minItems: 1
        contractId:
          type: string
          description: The contract id associated with this legal tag.
          example: A1234
        expirationDate:
          type: string
          format: date
          description: "The date when this legal tag expires. Format: yyyy-MM-dd.\
            \ Required for Second/Third Party Data (must be a real future date, not\
            \ the system default)."
          example: 2099-12-25
        originator:
          type: string
          description: The company or individual that created the data.
          example: Equinor
          pattern: "^[-. A-Za-z0-9]{3,60}$"
        dataType:
          type: string
          description: "The data type classification (e.g. 'Third Party Data', 'First\
            \ Party Data')."
          example: Third Party Data
        securityClassification:
          type: string
          description: "The security classification (e.g. 'Public', 'Private', 'Confidential')."
          example: Private
        personalData:
          type: string
          description: "The personal data type classification (e.g. 'No Personal Data',\
            \ 'Personal Data')."
          example: No Personal Data
        exportClassification:
          type: string
          description: "The export classification control number (e.g. 'EAR99', 'AT1')."
          example: EAR99
        extensionProperties:
          type: object
          additionalProperties: true
      required:
      - contractId
      - countryOfOrigin
      - dataType
      - expirationDate
      - exportClassification
      - originator
      - personalData
      - securityClassification
    AppError:
      type: object
      description: Standard error response returned by OSDU services.
      properties:
        code:
          type: integer
          format: int32
          description: HTTP status code.
          example: 400
        reason:
          type: string
          description: Short error reason.
          example: Bad Request
        message:
          type: string
          description: Detailed error message.
          example: Invalid record format.
    CreateLegalTag:
      type: object
      additionalProperties: false
      description: Request body for creating a LegalTag
      properties:
        name:
          type: string
          description: The name of the LegalTag
          example: OSDU-Private-EHCData
          maxLength: 95
          minLength: 3
          pattern: "^[-A-Za-z0-9]{3,95}$"
        description:
          type: string
          description: The description of the LegalTag
        properties:
          $ref: "#/components/schemas/CreateLegalTagProperties"
      required:
      - name
      - properties
    RequestLegalTags:
      type: object
      additionalProperties: false
      description: The model to retrieve multiple LegalTags in batch.
      properties:
        names:
          type: array
          description: The name of all the LegalTags to retrieve.
          items:
            type: string
            example: OSDU-Private-USA-EHC
            maxLength: 100
            minLength: 3
            pattern: "^[-A-Za-z0-9]{3,100}$"
          maxItems: 25
          minItems: 1
      required:
      - names
    InvalidTagWithReason:
      type: object
      description: Represents a single invalid LegalTag.
      properties:
        name:
          type: string
          description: The name of the LegalTag.
        reason:
          type: string
          description: The reason the LegalTag is currently invalid.
    InvalidTagsWithReason:
      type: object
      description: Represents a collection of invalid LegalTags.
      properties:
        invalidLegalTags:
          type: array
          description: A collection of invalid LegalTags
          items:
            $ref: "#/components/schemas/InvalidTagWithReason"
    QueryLegalTag:
      type: object
      additionalProperties: false
      description: Represents the Search Query objects for Legaltags.
      properties:
        queryList:
          type: array
          description: Filter condition query
          items:
            type: string
            minLength: 1
        operatorList:
          type: array
          description: "Logical operators for joining queryList conditions. Only the\
            \ first element is used. It is matched case-insensitively as a substring\
            \ against 'union', 'intersection', or 'add' (same as runtime). When omitted\
            \ or empty, union is assumed."
          items:
            type: string
            description: "First list element only. Case-insensitive substring match\
              \ for union, intersection, add."
            example: union
        sortBy:
          type: string
          description: The field to sort results by
        sortOrder:
          type: string
          description: "The sort order, e.g. 'ASC' or 'DESC'"
        limit:
          type: integer
          format: int32
          description: The maximum number of LegalTags to return. Must be a JSON number
            (not a string).
          maximum: 2147483647
          minimum: 0
      required:
      - queryList
    LegalTagDtos:
      type: object
      description: Represents a collection of LegalTags.
      properties:
        legalTags:
          type: array
          description: A collection of complete LegalTags
          items:
            $ref: "#/components/schemas/LegalTagDto"
    ReadablePropertyValues:
      type: object
      description: Shows the allowed values of the fields of a LegalTag.
      properties:
        countriesOfOrigin:
          type: object
          additionalProperties:
            type: string
          description: The values of all the allowed Countries of Origin with the
            ISO Alpha 2 code and country name.
        otherRelevantDataCountries:
          type: object
          additionalProperties:
            type: string
          description: The values of all the allowed Other Relevant Data Countries
            with the ISO Alpha 2 code and country name.
        securityClassifications:
          type: array
          description: The values of all the allowed Security Classifications.
          items:
            type: string
          uniqueItems: true
        exportClassificationControlNumbers:
          type: array
          description: The name of all the allowed Export Classifications.
          items:
            type: string
          uniqueItems: true
        personalDataTypes:
          type: array
          description: The name of all the allowed Personal Data Type values.
          items:
            type: string
          uniqueItems: true
        dataTypes:
          type: array
          description: The name of all the allowed Data Type values.
          items:
            type: string
          uniqueItems: true
    ConnectedOuterService:
      type: object
      description: Name and version of an external service that this OSDU service
        connects to.
      properties:
        name:
          type: string
          description: Name of the connected external service.
          example: storage
        version:
          type: string
          description: Version of the connected external service.
          example: 2.0.0
    FeatureFlagState:
      type: object
      description: State of a feature flag for a given partition and source.
      properties:
        name:
          type: string
          description: Name of the feature flag.
          example: collaborations-api
        enabled:
          type: boolean
          description: Whether the feature flag is currently enabled.
          example: true
        partition:
          type: string
          description: Data partition this flag applies to.
          example: opendes
        source:
          type: string
          description: Source configuration that provided this flag state.
          example: runtime
    VersionInfo:
      type: object
      description: Version and build information for an OSDU service.
      properties:
        groupId:
          type: string
          description: Maven group ID of the service artifact.
          example: org.opengroup.osdu
        artifactId:
          type: string
          description: Maven artifact ID of the service.
          example: os-search
        version:
          type: string
          description: Semantic version of the deployed service.
          example: 0.27.0
        buildTime:
          type: string
          description: ISO 8601 timestamp of the build.
          example: 2021-01-26T02:24:13.843Z
        branch:
          type: string
          description: Source control branch from which the service was built.
          example: main
        commitId:
          type: string
          description: Short commit SHA of the build.
          example: "7777777"
        commitMessage:
          type: string
          description: Commit message of the build.
          example: initial commit
        connectedOuterServices:
          type: array
          description: List of external services this service depends on.
          items:
            $ref: "#/components/schemas/ConnectedOuterService"
        featureFlagStates:
          type: array
          description: "Current feature flag states for this partition, if any."
          items:
            $ref: "#/components/schemas/FeatureFlagState"
    CreateLegalTagProperties:
      additionalProperties: false
      properties:
        countryOfOrigin:
          type: array
          description: List of ISO 3166-1 alpha-2 country codes where the data originated.
          example:
          - US
          items:
            type: string
            enum:
            - AR
            - AU
            - BB
            - BE
            - BH
            - BJ
            - BN
            - BO
            - BZ
            - CA
            - CH
            - CL
            - CO
            - CY
            - CZ
            - DK
            - DO
            - EC
            - ES
            - ET
            - FR
            - GB
            - GE
            - GL
            - GT
            - GY
            - HU
            - IT
            - JP
            - KR
            - LB
            - LK
            - LR
            - LT
            - MA
            - MG
            - MM
            - MR
            - NA
            - NL
            - "NO"
            - NZ
            - PG
            - PH
            - PL
            - PY
            - SG
            - SN
            - SR
            - TG
            - TH
            - TM
            - TN
            - TT
            - TW
            - UA
            - UG
            - US
            - UZ
            example: US
          minItems: 1
        contractId:
          type: string
          description: The contract id associated with this legal tag.
          example: A1234
          maxLength: 40
          minLength: 3
          pattern: "^(Unknown|No Contract Related|[-.A-Za-z0-9]{3,40})$"
        expirationDate:
          type: string
          format: date
          description: "The date when this legal tag expires. Format: yyyy-MM-dd.\
            \ Required for Second/Third Party Data (must be a real future date, not\
            \ the system default)."
          example: 2099-12-25
        originator:
          type: string
          description: The company or individual that created the data.
          example: Equinor
          maxLength: 60
          minLength: 3
          pattern: "^[A-Za-z0-9.-]([-. A-Za-z0-9]*[A-Za-z0-9.-])?$"
        dataType:
          type: string
          description: "The data type classification (e.g. 'Third Party Data', 'First\
            \ Party Data')."
          enum:
          - First Party Data
          - Public Domain Data
          - Transferred Data
          - Second Party Data
          - Third Party Data
          example: Third Party Data
        securityClassification:
          type: string
          description: "The security classification (e.g. 'Public', 'Private', 'Confidential')."
          enum:
          - Public
          - Private
          - Confidential
          example: Private
        personalData:
          type: string
          description: "The personal data type classification (e.g. 'No Personal Data',\
            \ 'Personal Data')."
          enum:
          - Personally Identifiable
          - No Personal Data
          example: No Personal Data
        exportClassification:
          type: string
          description: "The export classification control number (e.g. 'EAR99', 'AT1')."
          enum:
          - EAR99
          - 0A998
          - Not - Technical Data
          - No License Required
          example: EAR99
        extensionProperties:
          type: object
          additionalProperties: true
      required:
      - contractId
      - countryOfOrigin
      - dataType
      - expirationDate
      - exportClassification
      - originator
      - personalData
      - securityClassification
  securitySchemes:
    Authorization:
      type: http
      name: Authorization
      in: header
      scheme: bearer
      bearerFormat: Authorization
