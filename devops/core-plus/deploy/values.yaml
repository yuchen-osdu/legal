# Default values for legal-deploy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  domain: ""
  # Host the HTTPRoute attaches to when httpRoute.hostnames is empty.
  hostname: ""
  limitsEnabled: true
  dataPartitionId: ""

data:
  # configmaps
  logLevel: "ERROR"
  acceptHttp: "true"
  entitlementsHost: "http://entitlements"
  defaultLegalTag: "default-data-tag"
  legalHost: "http://legal"
  partitionHost: "http://partition"
  # deployments
  requestsCpu: "5m"
  requestsMemory: "325Mi"
  limitsCpu: "1"
  limitsMemory: "1G"
  legalStatusUpdateImage: ""
  cronJobServiceAccountName: ""
  serviceAccountName: "legal"
  imagePullPolicy: "Always"
  image: ""

conf:
  configmap: "legal-config"
  appName: "legal"
  s3SecretName: "legal-seaweedfs-secret"
  postgresSecretName: "legal-postgres-secret"
  rabbitmqSecretName: "rabbitmq-secret"
  bootstrapSecretName: "datafier-secret"
  replicas: 1

httpRoute:
  enabled: false
  # Route name. Defaults to "<release>-route" so it never collides with a route of the same name
  # defined outside this chart.
  name: ""
  parentRefs:
    - name: cimpl-gateway
      namespace: istio-system
  # Defaults to global.hostname when empty. The render fails when both are empty.
  hostnames: []
  # One rule per entry. Optional per entry: pathType (default PathPrefix), serviceName
  # (default conf.appName), port (default 80) and filters (for example URLRewrite).
  routes:
    - path: /api/legal/

istio:
  proxyCPU: "5m"
  proxyCPULimit: "500m"
  proxyMemory: "50Mi"
  proxyMemoryLimit: "512Mi"
