variables:
  CORE_BUILD_SUBDIR: legal-core

  # Full Docker Hub tag after "maven:" — flip to ...-temurin-25 for Java 25 compile/test.
  # Keep in sync with SERVICE_JAVA_VERSION (plugin-download jobs).
  # Dependency scanning: SBOM early-mover (sbom-maven.yml); do not set DS_JAVA_VERSION: "25".
  MAVEN_IMAGE_TAG: "3.9.16-eclipse-temurin-25"
  SERVICE_JAVA_VERSION: "3.9.16-eclipse-temurin-25"

  # Spotbugs is only intended for Groovy, Scala, or Koitlin development; not Maven+Java
  # We exclude it here to speed up pipeline execution, and avoid having the image fail on our Maven builds
  # Maven jobs should be using semgrep instead
  SAST_EXCLUDED_ANALYZERS: "spotbugs"
  ACCEPTANCE_TEST_DIR: "legal-acceptance-test"

  # Discover OpenAPI specs via springdoc swagger-config.
  # Do not set CIMPL_OPENAPI_YAML_ROUTE or CIMPL_OPENAPI_SPEC_PATH — those bypass
  # discovery and pin openapi-spec checks to a single route (ci-cd-pipelines#65).
  # Schemathesis routes are set via .schemathesis-legal-matrix below.
  CIMPL_OPENAPI_CONFIG_ROUTE: /api/legal/v1/api-docs/swagger-config

include:
  - project: "osdu/platform/ci-cd-pipelines"
    file: "standard-setup.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "build/maven.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "scanners/fossa-maven.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "scanners/gitlab-ultimate.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "scanners/sbom-maven.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "reporting/reporting.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/cimpl-global.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "reporting/schemathesis.yml"

  - local: "devops/core-plus/pipeline/override-stages.yml"

  - local: "/publish.yml"

# Java 25 FOSSA image (divido/fossa-with-cache!19). Shared fossa-maven.yml still
# defaults to v0.10 (JDK 17); override until ci-cd-pipelines bumps the default.
fossa-analyze:
  image: $CI_REGISTRY/divido/fossa-with-cache:v0.11

fossa-check-notice:
  image: $CI_REGISTRY/divido/fossa-with-cache:v0.11

download_plugins:
  image: maven:${SERVICE_JAVA_VERSION}
  stage: build
  variables:
    OSM_PACKAGE_REGISTRY_URL: "https://community.opengroup.org/api/v4/projects/1448/packages/maven"
    OSM_VERSION: "1.1.0"
    OBM_PACKAGE_REGISTRY_URL: "https://community.opengroup.org/api/v4/projects/1441/packages/maven"
    OBM_VERSION: "1.0.0"
    OQM_PACKAGE_REGISRTY_URL: "https://community.opengroup.org/api/v4/projects/1450/packages/maven"
    OQM_VERSION: "1.0.0"

  artifacts:
    paths:
      - ./tmp/*.jar
    when: always
    expire_in: 1 days

  script:
    - mvn dependency:copy -DrepoUrl=$OSM_PACKAGE_REGISTRY_URL -Dartifact="org.opengroup.osdu:os-osm-postgres:$OSM_VERSION:jar:plugin" -Dtransitive=false -DoutputDirectory="./tmp"
    - mvn dependency:copy -DrepoUrl=$OBM_PACKAGE_REGISTRY_URL -Dartifact="org.opengroup.osdu:os-obm-s3:$OBM_VERSION:jar:plugin" -Dtransitive=false -DoutputDirectory="./tmp"
    - mvn dependency:copy -DrepoUrl=$OQM_PACKAGE_REGISRTY_URL -Dartifact="org.opengroup.osdu:os-oqm-rabbitmq:$OQM_VERSION:jar:plugin" -Dtransitive=false -DoutputDirectory="./tmp"

  only:
    variables:
      - $PROTECTED == '1'

# Schemathesis jobs load schemathesis-tests/schemathesis.toml via
# SCHEMATHESIS_CONFIG_FILE when present (see reporting/schemathesis.yml).
.schemathesis-legal-common:
  variables:
    # Floating tag, same as ci-cd-pipelines reporting/schemathesis.yml.
    SCHEMATHESIS_BASE_IMAGE: community.opengroup.org:5555/osdu/platform/system/sdks/schemathesis-base:latest
    # The shared runner's 120s default overrides TOML; preserve Legal's 30s timeout.
    SCHEMATHESIS_REQUEST_TIMEOUT: "30"

.schemathesis-legal-matrix:
  parallel:
    matrix:
      - SCHEMATHESIS_OPENAPI_YAML_ROUTE:
          - "/api/legal/v1/api-docs.yaml"

schemathesis-dev-tests:
  extends:
    - .cimpl-dev-variables
    - .schemathesis-osdu-main-tests-template
    - .schemathesis-legal-common
    - .schemathesis-legal-matrix

schemathesis-dev-backup-tests:
  extends:
    - .cimpl-dev-backup-variables
    - .schemathesis-osdu-main-tests-template
    - .schemathesis-legal-common
    - .schemathesis-legal-matrix

schemathesis-prod-tests:
  extends:
    - .cimpl-prod-variables
    - .schemathesis-osdu-main-tests-template
    - .schemathesis-legal-common
    - .schemathesis-legal-matrix
